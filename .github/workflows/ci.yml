name: CI

on:
  push:
    branches: [main, develop, staging, 'feature/**', 'infra/**']
  pull_request:
    branches: [main, develop, staging]

jobs:
  check:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Test
        run: npm test -- --ci --passWithNoTests

      - name: Build
        run: npm run build

  docker-build:
    name: Docker build (only staging/main)
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t subscripciones-api:${{ github.sha }} .
